# Presentation. Paragraphs are separated by an empty line; {{ }} = written by Claude, to be checked (see the project files).
intro: |-
  I am a 3D Artist and Visual Designer who, as a child, fell madly in love with the videogames of the Pokémon and Mario franchises. That sense of wonder never left me, and today I bring it into everything I make, from 3D art to visual design, motion graphics and interactive experiences.

  Whatever the medium, my goal stays the same: to tell a story through my work and let people feel a child-like sense of wonder.
