sections:
  overview: |-
    The Ferrari Roma Spider is a car whose design strongly represents its brand. This internal project set out to recreate it as a highly detailed 3D model for viewing on Apple Vision Pro.
  role: |-
    I modeled, retopologized and textured the whole car, from the bodywork to the interior. The challenge was to capture the subtle surfaces and details of the Ferrari design language while staying within a target of 1,000,000 triangles, so that the model could be displayed smoothly in mixed reality.
  result: |-
    The finished Roma Spider can be explored up close on Apple Vision Pro, showing how far a single asset can go in realism within the limits of a headset.
