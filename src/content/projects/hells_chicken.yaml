text: Hell’s Chicken is a 2.5D video game developed in Unity for Windows. It was designed and developed for the course of Videogame Design and Programming of Politecnico di Milano, and later published to itch.io as a downloadable demo. The game follows the adventures of Lucifer, who, now a chicken, has fallen to Hell and must escape it, avoiding the monsters who don't recognize him.
