sections:
  overview: |-
    Hell's Chicken is a 2.5D video game developed in Unity for Windows. It was designed and developed for the course of Videogame Design and Programming of Politecnico di Milano.

    The game follows the adventures of Lucifer: thrown into Hell for rebelling against God, during his fall he possesses the body of an unlucky chicken. Now a chicken, he must escape Hell, avoiding the monsters who don't recognize him, and try to make it back to Heaven.
  role: |-
    The goal was to create an easy-to-use game with an ironic character. In the making of Hell's Chicken, the main focus was placed on the creation of captivating-looking environments that would allow gameplay with intuitive mechanics. I created, rigged and animated the 3D environments and the game characters with Blender, and hand-painted the textures of the 3D models.
  result: |-
    Hell's Chicken was later published on itch.io as a downloadable demo.
