sections:
  overview: |-
    The DNA of Rome is the closing section of “Roma nel Mondo”, the exhibition curated by Ricky Burdett at MAXXI in Rome (December 2025 – April 2026). Light and data are projected onto Terracotta Rome, a monumental model of the city made of 953 terracotta tiles, turning it into a living map of Rome's history and infrastructure.
  role: |-
    I built the spatial experience in Reality Composer Pro ahead of the installation and managed the infographics projected onto the model. The challenge was precision: every infographic had to match the surface and geometry of the physical model, so that the projections stayed perfectly aligned throughout the show.
  result: |-
    The installation accompanied the exhibition for its whole run, giving visitors a dynamic reading of the city's past and present directly on the largest model of Rome ever produced.
