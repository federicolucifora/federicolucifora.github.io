sections:
  overview: |-
    Futura is the metaverse created by Plenitude (Eni) to make energy saving and sustainability engaging through play. Launched in 2024, it is made of five continents spread across popular platforms such as Spatial, Fortnite, Roblox and Rec Room.
  role: |-
    Throughout the project I created and textured 3D assets for its environments and worked on the environment design of several levels in Unity and Roblox Studio. I also contributed to the 3D representation of the Futura World, designing some of its continents together with their materials and textures, and took care of animation: the characters and buildings of the Roblox continents, and the camera work of the project's trailers.

    The main challenge was keeping a recognizable visual identity across very different platforms, each with its own technical limits and style.
  result: |-
    Futura reached thousands of players across its platforms, thanks also to collaborations with influencers such as Roby, one of the most followed creators of the Italian Roblox community, and to its presence at events such as Lucca Comics & Games.
