- title: Futura Ville
  text: |-
    Futura Ville is the continent of Futura built on Roblox. In Roblox Studio I worked on the environment design of its levels and created its 3D assets, keeping the look of Futura within the technical limits and the style of the platform.

    The continent is also home to the Buddies, the characters that accompany players through Futura. I created the Buddies and all their animations: the spawn animation that plays when they appear, the idle animation while they wait, and the one for when they are collected.
