- title: Futura Blocks
  text: |-
    Futura Blocks is the newest continent of Futura, launched on Roblox in April 2026 during Milan Design Week. It is the continent of building: each player gets their own block, an island made of hexagonal tiles, and is challenged to grow it into a society based on virtuous energy models.

    I created all the 3D elements of the continent. To build the islands, I developed a system inside Blender that generates them procedurally from hexagonal pieces, so that every island could be produced quickly while keeping a consistent look.

    I also animated how each model appears on the island: every building and object has its own spawn animation, which plays every time a player places it, turning each construction into a small moment of reward. These animations were then used in the trailer that presented Futura Blocks at Milan Design Week.
