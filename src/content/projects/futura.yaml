# The continents of Futura I worked on: each one is a chapter with its text and its own gallery.
chaptersTitle: Continents
chapters:
- title: Futura World
  text: |-
    Futura World is the planet that holds all the continents of Futura. For its 3D representation I designed some of the continents, together with their materials and textures, so that each one has its own character while the planet still reads as a single world.

    I also created the animations for the trailer that presents the planet, studying the camera movements and the timing of each shot to guide the viewer from one continent to the next.
