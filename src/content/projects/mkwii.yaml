- title: Snowpoint Valley
  text: Snowpoint Valley is a simple track set in a snowy environment, featuring a few surprising turns and slopes. The track is inspired by various Mario Kart levels, such as Sherbet Land and Mount Wario.
  media:
  - youtube: tNTk2qMx7uI
