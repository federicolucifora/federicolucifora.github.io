sections:
  overview: |-
    Mario Kart Wii Custom Tracks are a series of playable levels made for the online community of creators who, more than a decade after the game's release, keep extending Mario Kart Wii with new tracks. The community is still very active, with dozens of creators and an audience of over a million spectators on YouTube.
  role: |-
    For each track I followed the whole process, from the concept to 3D modeling, environment art, level design and texture editing, up to the setup of the playable track with the community's modding tools.

    The main challenge is the game's hardware: levels cannot exceed 30,000 triangles and textures are limited in size and number, so every environment has to look rich with very few resources.
  result: |-
    The tracks range from a homage to Studio Ghibli to demanding courses for expert players. The most popular, Castle in the Sky, reached over 40,000 viewers on YouTube and was widely appreciated by the community.
