# The four tracks: each one is a chapter with its text and its own gallery (video first, then the pictures).
chaptersTitle: Tracks
chapters:
- title: Castle in the Sky
  thumb: mkwii/mkwii12.jpg
  text: 'Castle in the Sky is a track set in the world of the homonymous Studio Ghibli movie. The track follows the events of the film, taking the player through its most iconic environments. The biggest challenge was working within the game''s strict hardware limitations, while attempting to create very large environments: Mario Kart Wii does not support levels exceeding 30,000 triangles and has significant restrictions on texture size and quantity. Nevertheless, the track successfully reached an audience of over 40,000 people on YouTube and was widely appreciated.'
