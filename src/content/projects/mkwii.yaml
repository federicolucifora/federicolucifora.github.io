- title: Dragon Burying Grounds
  text: Dragon Burying Grounds is a track set in a volcanic landscape, designed to appeal to the more hardcore Mario Kart Wii fanbase. It features a series of challenging turns and, most importantly, well-placed shortcuts that are difficult to execute but highly rewarding.
