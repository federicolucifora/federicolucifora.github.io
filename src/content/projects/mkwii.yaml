text: “Mario Kart Wii - Custom Tracks” are a series of playable levels created for the videogame Mario Kart Wii. I started creating these circuits when I discovered an online community of creators who, passionate about the video game, wanted to use their ideas to extend its playability. The strength of the community is demonstrated by the media popularity of the game long after its release. In 2021, more than 12 years after its publication, Mario Kart Wii still boasts dozens of creators and a pool of spectators that exceeds 1,000,000 on Youtube.
