  text: 'To convey this environment, I chose to use the medium of video: I thought that the environment of the poster could truly be "irreducible." Consequently, I imagined a seemingly small world that, however, proves to be much larger once entered into the poster. The final phase of the video serves as a moment of wonder to surprise the viewer, who initially expected simply a scene set in a fantastical place, but is then provided with a new perspective.'
