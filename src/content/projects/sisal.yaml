sections:
  overview: |-
    The Sisal Immersive Museum is an interactive space that tells the story and heritage of Sisal, letting visitors walk through recreated environments and shops from different moments of the company's history.
  role: |-
    I created and textured various 3D assets for two environments: the library and an old betting shop. The betting shop received the most care: the goal was to make visitors feel inside a real betting shop of the past, with blackboards and handwritten match results. Texturing was the key to conveying a vintage atmosphere without making everything look artificially aged.
  result: |-
    The museum runs in virtual reality on Meta Quest 3 headsets and can be explored by several visitors at the same time, so groups of people can step together into the places where Sisal's history was made.
