  text: The betting shop was the most carefully designed environment. The goal was to make the user feel as if they were inside an old betting shop, complete with blackboards and tables displaying match results written by hand. The texturing process was fundamental in achieving this, aiming to convey a vintage feel without making it look artificially aged.
