text: The Sisal Immersive Museum is an interactive space designed to showcase the story and heritage of Sisal. The experience allows users to explore how the company has evolved over time, recreating past environments and shops. I worked on the creation of various assets used in both the library environment and the betting shop, where people once placed their bets..
