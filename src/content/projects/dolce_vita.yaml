text: 'Le Auto della Dolce Vita is a project commissioned by the Automobile Club Italia. My main contribution to this project was the creation of the Triumph, a vintage sports car. I started with a pre-existing asset of a similar car and used reference images and photogrammetry to refine it into an accurate representation of the Triumph. I also created the environment in which the car is placed: the Trevi Fountain. The fountain was also based on a pre-existing model, which I then retopologized and retextured. Both the car and environment were designed for viewing on the Apple Vision Pro. The goal was to create a highly realistic car, nearly indistinguishable from the real one. Both the Triumph and the Trevi Fountain models consist of approximately 1 million triangles each.'
