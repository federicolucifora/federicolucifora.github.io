sections:
  overview: |-
    Le Auto della Dolce Vita is an immersive experience created for Automobile Club d'Italia as the first chapter of ACI Experience, a research project that connects Italy's motoring heritage with new technologies. Wearing an Apple Vision Pro, visitors take a virtual drive through the landmarks of the Roman Dolce Vita, from Via Veneto to the Trevi Fountain, starting from the Triumph TR3A driven by Marcello Mastroianni in Fellini's film.
  role: |-
    I created the Triumph and the Trevi Fountain environment. Starting from an existing model of a similar car, I used reference images and photogrammetry to rebuild it into an accurate Triumph; the fountain was also based on an existing model, which I retopologized and retextured.

    The challenge was realism: the car had to be nearly indistinguishable from the real one while staying light enough for a headset, so both assets were optimized to about one million triangles each. I also worked on the motion graphics videos that promoted the project on social media, creating the transition from a wireframe environment to the fully textured scene.
  result: |-
    The experience was presented at the ACI stand of Auto e Moto d'Epoca in Bologna, where visitors tried it on Apple Vision Pro next to the real car. The two models delivered the level of detail needed for a convincing, close-up view in mixed reality.
