sections:
  overview: |-
    DNA of Italian Motorsport is an immersive experience created for Automobile Club d'Italia that tells the story of Italian motorsport through some of its most iconic cars, designed to be explored in mixed reality. The journey spans almost a century of racing: from the Alfa Romeo P3 of the 1930s and the Ferrari 375 Plus, through the rally legends Lancia Stratos HF and Lancia Delta HF Integrale Evoluzione 2, up to the Tatuus F4 single-seater of today.
  role: |-
    I took care of the 3D realization of the featured cars, optimizing every model for photorealistic visualization and full compatibility with Reality Composer Pro. The challenge was to keep the level of detail expected from historic racing cars while respecting the performance limits of a real-time experience.

    I was also responsible for the CGI scenes of the project's trailer, directing the camera so that each shot flows smoothly into the transitions between scenes. Finally, together with the graphic designer of my company, I created the graphics of the project's posters, bringing the 3D cars into the visual identity of the experience.
  result: |-
    The project brought to life a collection of photorealistic car models that run smoothly in real time, together with a CGI trailer that introduces visitors to the experience and its atmosphere.
